name: Update USGS Earthquake Placefile

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions scheduled workflows run no more frequently than every 5 minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-placefile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate the latest USGS earthquake placefile
        run: python3 generate_placefile.py

      - name: Commit updated placefile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add earthquakes_24h.txt
          git diff --cached --quiet || git commit -m "Update USGS earthquake placefile"
          git push
